<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<!--CSP-->
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Simpler Flutter</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="tasks/tasks.css">
</head>
<body>
	<header class="bar">
		<div class="brand">
			<div class="logo" aria-hidden="true">
				<img class="logo__img" src="logo.png" alt="">
			</div>
			<div>
				<h1 class="brand__title" data-type="Simpler Flutter" aria-label="Simpler Flutter"></h1>
				<p>Главное меню. Отсюда открываются студии.</p>
			</div>
		</div>
	</header>
	<div class="shell">
		<nav id="nav">
			<button type="button" class="nav-item on" data-target="studio">
				<span>Architecture Studio</span>
				<em>1/2</em>
			</button>
			<button type="button" class="nav-item" data-target="images">
				<span>Images Studio</span>
				<em>2/2</em>
			</button>
			<button type="button" class="nav-item nav-item--external" data-target="tasks">
				<span>Simpler Flutter Tasks</span>
				<em>↗</em>
			</button>
		</nav>
		<main>
			<input id="search" type="search" placeholder="Search settings..." autocomplete="off">
			<section class="block" data-id="studio" data-title="architecture studio">
				<button type="button" class="block-head" data-command="studio">
					<div>
						<strong>Architecture Studio</strong>
						<em>1/2</em>
						<p>Слои, Use Bloc или Use Cubit, дерево файлов и yaml.</p>
					</div>
				</button>
			</section>
			<section class="block" data-id="images" data-title="images studio">
				<button type="button" class="block-head" data-command="images">
					<div>
						<strong>Images Studio</strong>
						<em>2/2</em>
						<p>Группы, пути, типы и запись simpler_generator_images.yaml.</p>
					</div>
				</button>
			</section>
			<section class="block block--external" data-id="tasks" data-title="simpler flutter tasks status bar custom commands build apk ipa flavor git">
				<div id="tasksCard"></div>
			</section>
		</main>
	</div>
	<script src="tasks/tasks.js"></script>
	<script src="app.js"></script>
</body>
</html>
